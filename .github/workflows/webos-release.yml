name: Build and Publish webOS App

on:
    release:
        types: [published]

permissions:
    contents: write

concurrency:
    group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
    cancel-in-progress: true

jobs:
    webos:
        name: Build and package webOS app
        runs-on: ubuntu-latest
        env:
            TAG: ${{ github.event.release.tag_name }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install go-task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install webOS TV CLI
              run: npm install -g @webos-tools/cli

            - name: Install dependencies
              run: task webos:install

            - name: Build webOS bundle
              env:
                  VITE_PING_TOKEN: ${{ secrets.STATS_TOKEN }}
              run: task webos:build

            - name: Package .ipk
              run: task webos:package

            - name: Rename asset
              run: mv webos/*.ipk "pelagica-webos-${TAG}.ipk"

            - name: Generate homebrew app store manifest
              run: |
                  APP_ID=$(jq -r '.id' webos/public/appinfo.json)
                  VERSION=$(jq -r '.version' webos/public/appinfo.json)
                  TITLE=$(jq -r '.title' webos/public/appinfo.json)
                  DESCRIPTION=$(jq -r '.appDescription' webos/public/appinfo.json)
                  IPK_NAME="pelagica-webos-${TAG}.ipk"
                  SHA256=$(sha256sum "$IPK_NAME" | cut -d ' ' -f1)

                  jq -n \
                      --arg id "$APP_ID" \
                      --arg version "$VERSION" \
                      --arg title "$TITLE" \
                      --arg description "$DESCRIPTION" \
                      --arg sha256 "$SHA256" \
                      --arg ipkUrl "$IPK_NAME" \
                      '{
                          id: $id,
                          version: $version,
                          type: "web",
                          title: $title,
                          appDescription: $description,
                          iconUri: "https://raw.githubusercontent.com/PelagicaApp/pelagica/refs/heads/main/.github/assets/logo/logo_webOS_160.png",
                          sourceUrl: "https://github.com/PelagicaApp/pelagica",
                          rootRequired: false,
                          ipkUrl: $ipkUrl,
                          ipkHash: { sha256: $sha256 }
                      }' > "$APP_ID.manifest.json"

                  echo "MANIFEST_FILE=$APP_ID.manifest.json" >> "$GITHUB_ENV"
                  echo "IPK_NAME=$IPK_NAME" >> "$GITHUB_ENV"

            - name: Upload assets to release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release upload "$TAG" "$IPK_NAME" "$MANIFEST_FILE" --clobber
