name: Build Fork Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: iseaton/pelagica

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/iseaton/pelagica:latest
            ghcr.io/iseaton/pelagica:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
            COLLECTOR_PING_TOKEN=
          cache-from: type=gha,scope=${{ github.repository }}-dev-amd64
          cache-to: type=gha,scope=${{ github.repository }}-dev-amd64,mode=max
