name: Build and Publish Desktop App

on:
    release:
        types: [published]

permissions:
    contents: write

concurrency:
    group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
    cancel-in-progress: true

jobs:
    macos:
        name: Build macOS app and installer
        runs-on: macos-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: desktop/go.mod

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install go-task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install create-dmg
              run: brew install create-dmg

            - name: Import Developer ID certificate
              env:
                  MACOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
                  MACOS_CERTIFICATE_PWD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
              run: |
                  KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
                  KEYCHAIN_PWD=$(openssl rand -base64 24)
                  echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
                  echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

                  security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
                  security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
                  security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
                  security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
                  security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
                  rm -f "$RUNNER_TEMP/certificate.p12"

                  IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -o '"Developer ID Application:[^"]*"' | head -1 | tr -d '"')
                  if [ -z "$IDENTITY" ]; then
                    echo "::error::No 'Developer ID Application' identity found in the imported certificate" >&2
                    exit 1
                  fi
                  echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

            - name: Build and sign macOS app
              env:
                  CODESIGN_OPTIONS: runtime
              run: task desktop:package:macos

            - name: Notarize app
              working-directory: desktop/bin
              env:
                  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
                  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
                  APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
              run: |
                  echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
                  ditto -c -k --keepParent Pelagica.app Pelagica-notarize.zip
                  xcrun notarytool submit Pelagica-notarize.zip \
                    --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
                    --wait
                  xcrun stapler staple Pelagica.app
                  rm -f Pelagica-notarize.zip

            - name: Build DMG installer
              working-directory: desktop
              run: |
                  rm -f bin/Pelagica.dmg
                  rm -rf bin/dmg-staging
                  mkdir -p bin/dmg-staging
                  cp -r bin/Pelagica.app bin/dmg-staging/
                  create-dmg --volname "Pelagica" --volicon "build/driveicon.icns" --window-size 660 400 --icon-size 100 --icon "Pelagica.app" 175 190 --hide-extension "Pelagica.app" --app-drop-link 480 190 "bin/Pelagica.dmg" "bin/dmg-staging"
                  rm -rf bin/dmg-staging
                  codesign --force --sign "$CODESIGN_IDENTITY" bin/Pelagica.dmg

            - name: Notarize DMG
              working-directory: desktop/bin
              env:
                  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
                  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
              run: |
                  xcrun notarytool submit Pelagica.dmg \
                    --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
                    --wait
                  xcrun stapler staple Pelagica.dmg
                  rm -f "$RUNNER_TEMP/AuthKey.p8"

            - name: Rename assets
              working-directory: desktop/bin
              run: |
                  arch=$(uname -m)
                  if [ "$arch" = "x86_64" ]; then arch="amd64"; fi
                  echo "ARCH=$arch" >> "$GITHUB_ENV"
                  zip -r "pelagica-macos-${arch}.zip" Pelagica.app
                  mv Pelagica.dmg "pelagica-macos-${arch}.dmg"

            - name: Upload assets to release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release upload "${{ github.event.release.tag_name }}" \
                    "desktop/bin/pelagica-macos-${ARCH}.zip" \
                    "desktop/bin/pelagica-macos-${ARCH}.dmg" \
                    --clobber

            - name: Clean up keychain
              if: always()
              run: '[ -n "$KEYCHAIN_PATH" ] && security delete-keychain "$KEYCHAIN_PATH" || true'

    windows:
        name: Build Windows installer
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: desktop/go.mod

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install go-task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install wails3 CLI
              run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

            - name: Add Go bin to PATH
              shell: bash
              run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            - name: Install NSIS
              run: choco install nsis -y

            - name: Add NSIS to PATH
              shell: bash
              run: echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

            - name: Build Windows installer
              run: task desktop:installer:windows

            - name: Rename asset
              working-directory: desktop/bin
              shell: bash
              run: mv Pelagica-amd64-installer.exe pelagica-windows-amd64-installer.exe

            - name: Upload asset to release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release upload "${{ github.event.release.tag_name }}" desktop/bin/pelagica-windows-amd64-installer.exe --clobber

    linux:
        name: Build Linux installers
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: desktop/go.mod

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install go-task
              uses: arduino/setup-task@v2
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

            - name: Install wails3 CLI
              run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

            - name: Add Go bin to PATH
              run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            - name: Build Linux installers
              run: task desktop:installer:linux

            - name: Rename assets
              working-directory: desktop/bin
              run: |
                  mv pelagica.deb pelagica-linux-amd64.deb
                  mv pelagica.pkg.tar.zst pelagica-linux-amd64.pkg.tar.zst
                  mv pelagica-x86_64.AppImage pelagica-linux-amd64.AppImage

            - name: Upload assets to release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release upload "${{ github.event.release.tag_name }}" \
                    "desktop/bin/pelagica-linux-amd64.deb" \
                    "desktop/bin/pelagica-linux-amd64.pkg.tar.zst" \
                    "desktop/bin/pelagica-linux-amd64.AppImage" \
                    --clobber

    notify-tap:
        name: Notify homebrew tap
        needs: [macos, windows, linux]
        if: success()
        runs-on: ubuntu-latest
        steps:
            - name: Trigger cask bump
              uses: peter-evans/repository-dispatch@v4
              with:
                  token: ${{ secrets.TAP_DISPATCH_TOKEN }}
                  repository: PelagicaApp/homebrew-pelagica
                  event-type: pelagica-released
                  client-payload: '{"tag": "${{ github.event.release.tag_name }}"}'
